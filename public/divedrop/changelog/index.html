<!DOCTYPE html>

<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiveDrop – Changelog | Strategea</title>
<link rel="canonical" href="https://divedrop.app/changelog/">
<meta name="description" content="What changed in each version of DiveDrop for iPhone and Android.">
<link rel="icon" href="../img/icon.png">

<style>
  :root{--bg-color:#f9f9fb;--text-primary:#111827;--text-secondary:#4b5563;--muted:#9099a8;--accent-1:#54b3d6;--accent-2:#2a5a8a;--card-bg:#fff;--line:rgba(17,24,39,.08)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit','Montserrat',sans-serif;background:var(--bg-color);color:var(--text-primary);-webkit-font-smoothing:antialiased}
  a{color:var(--accent-2)}
  .wrap{max-width:760px;margin:0 auto;padding:4rem 1.25rem 3rem}
  .lang-toggle{position:absolute;top:2rem;right:2rem;display:flex;background:var(--card-bg);border-radius:50px;box-shadow:0 4px 6px -1px rgba(0,0,0,.05);padding:.25rem;z-index:10}
  .lang-toggle button{background:transparent;border:0;padding:.5rem 1rem;font-family:inherit;font-weight:600;font-size:.9rem;color:var(--text-secondary);border-radius:50px;cursor:pointer}
  .lang-toggle button.active{background:var(--text-primary);color:#fff}
  .brand{display:flex;align-items:center;gap:.6rem;font-weight:600;color:var(--text-secondary);font-size:.9rem;text-decoration:none;margin-bottom:2.5rem}
  .brand .appicon{width:36px;height:36px;border-radius:9px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .brand span{color:var(--text-primary);font-size:1.05rem}.brand small{color:var(--text-secondary);font-weight:500;font-size:.85rem;margin-left:.35rem}
  h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.5rem;text-wrap:balance}
  .intro{color:var(--text-secondary);line-height:1.65;margin-bottom:2.25rem}
  .rel{display:grid;grid-template-columns:7.5rem 1fr;gap:0 1.5rem;padding:1.6rem 0;border-top:1px solid var(--line)}
  .ver{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem;margin-bottom:.7rem}
  .chip{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:.3rem .7rem}
  .chip.review{background:#fdf1dc;color:#8a5a0a}
  .chip.done{background:#e3f2f8;color:var(--accent-2)}
  .when{color:var(--muted);font-size:.9rem;font-weight:500}
  .plat{display:inline-flex;align-items:center;gap:.3rem;font-size:.85rem;font-weight:600;color:var(--text-secondary)}
  .plat svg{width:14px;height:14px;fill:currentColor}
  .rel p{color:var(--text-secondary);line-height:1.65;max-width:62ch}
  .rel p + p{margin-top:.5rem}
  .rel .aside{font-size:.92rem;color:var(--muted)}
  footer{margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--line);color:var(--text-secondary);font-size:.85rem;line-height:1.7}
  @media (max-width:560px){.rel{grid-template-columns:1fr}.ver{margin-bottom:.6rem}.lang-toggle{top:1rem;right:1rem}}
</style>
</head>

function apply(lang){
  const t = T[lang] || T.en; document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n] ?? ''; });
  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  try { localStorage.setItem('divedrop.lang', lang); } catch (e) {}
}
document.querySelectorAll('.lang-toggle button').forEach(b => b.addEventListener('click', () => apply(b.dataset.lang)));
let start = 'en'; try { start = localStorage.getItem('divedrop.lang') || (l => l.startsWith('nl') ? 'nl' : l.startsWith('fr') ? 'fr' : 'en')((navigator.language || '').toLowerCase()); } catch (e) {}
apply(start);
