  help_a:"A .uddf or a .fit is enough. We do not need your SSI login and would have no use for it. What arrives is used to test the parser and deleted once it stops being useful.",

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function apply(lang){
  const t = T[lang] || T.en;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n] ?? ''; });

  document.getElementById('groups').innerHTML = GROUPS.map(g => {
    const cards = g.rows.map(r => {
      const label = r.s === 'ok' ? t.lg_ok : r.s === 'maybe' ? t.lg_maybe : t.lg_via;
      const fields = FIELDS.map(k => {
        const st = r.f[k];                       // y, n or u
        const mark = st === 'y' ? '✓' : st === 'n' ? '–' : '?';
        return '<span class="f ' + st + '"><i>' + mark + '</i>' + esc(t['f_' + k]) + '</span>';
      }).join('');
      return '<article class="dev">' +
        '<header><h4>' + esc(r.dev) + '<span class="models">' + esc(r.models) + '</span></h4>' +
        '<span class="pill ' + r.s + '">' + esc(label) + '</span></header>' +
        '<p class="route">' + esc(r.route[lang] || r.route.en) + '</p>' +
        '<div class="fields">' + fields + '</div>' +
        '<p class="note">' + esc(r.note[lang] || r.note.en) + '</p>' +
        '</article>';
    }).join('');
    return '<section class="group"><div class="group-head"><h3>' + esc(t['g_' + g.id]) + '</h3>' +
      (g.ext ? '<span class="ext">' + esc(g.ext) + '</span>' : '') + '</div>' +
      '<p class="group-note">' + esc(t['g_' + g.id + '_n']) + '</p>' +
      '<div class="cards">' + cards + '</div></section>';
  }).join('');

  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  try { localStorage.setItem('divedrop.lang', lang); } catch (e) {}
}
document.querySelectorAll('.lang-toggle button').forEach(b => b.addEventListener('click', () => apply(b.dataset.lang)));
let start = 'en';
try { start = localStorage.getItem('divedrop.lang') || (l => l.startsWith('nl') ? 'nl' : l.startsWith('fr') ? 'fr' : 'en')((navigator.language || '').toLowerCase()); } catch (e) {}
apply(start);
</script>
