<style>
  :root{--bg-color:#f9f9fb;--text-primary:#111827;--text-secondary:#4b5563;--muted:#9099a8;--accent-1:#54b3d6;--accent-2:#2a5a8a;--card-bg:#fff;--line:rgba(17,24,39,.08)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit','Montserrat',sans-serif;background:var(--bg-color);color:var(--text-primary);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:var(--accent-2)}
  .wrap{max-width:1000px;margin:0 auto;padding:4rem 1.25rem 3rem}
  .lang-toggle{position:absolute;top:2rem;right:2rem;display:flex;background:var(--card-bg);border-radius:50px;box-shadow:0 4px 6px -1px rgba(0,0,0,.05);padding:.25rem;z-index:10}
  .lang-toggle button{background:transparent;border:0;padding:.5rem 1rem;font-family:inherit;font-weight:600;font-size:.9rem;color:var(--text-secondary);border-radius:50px;cursor:pointer;transition:all .3s}
  .lang-toggle button.active{background:var(--text-primary);color:#fff}
  .brand{display:flex;align-items:center;gap:.6rem;font-weight:600;color:var(--text-secondary);font-size:.9rem;text-decoration:none;margin-bottom:3rem}
  .brand img{height:30px}
  .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:3rem;align-items:center;margin-bottom:4rem}
  .hero .icon{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px -5px rgba(42,90,138,.35);margin-bottom:1.25rem}
  h1{font-size:3rem;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-bottom:.75rem}
  .tag{font-size:1.25rem;color:var(--text-secondary);font-weight:300;max-width:34ch;margin-bottom:1.5rem}

  /* store buttons */
  .stores{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
  .store{display:inline-flex;align-items:center;gap:.7rem;background:var(--text-primary);color:#fff;text-decoration:none;padding:.7rem 1.25rem;border-radius:14px;transition:transform .3s,box-shadow .3s}
  .store:hover{transform:translateY(-2px);box-shadow:0 10px 25px -5px rgba(0,0,0,.25)}
  .store svg{width:22px;height:22px;flex:none;fill:currentColor}
  .store b{display:block;font-size:1rem;font-weight:700;line-height:1.15}
  .store small{display:block;font-size:.7rem;font-weight:400;opacity:.75;letter-spacing:.02em}
  .store.soon{background:var(--card-bg);color:var(--text-secondary);border:1px dashed rgba(17,24,39,.22);cursor:default}
  .store.soon:hover{transform:none;box-shadow:none}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .how-link{display:inline-block;margin-top:1rem;font-weight:600;font-size:.95rem}
  .video{margin:3.5rem 0 0}
  .videobox{position:relative;margin-top:1.25rem;border-radius:24px;overflow:hidden;background:#0d0f14;aspect-ratio:16/9;box-shadow:0 20px 45px -15px rgba(17,24,39,.25)}

  .vidbtn{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:none;cursor:pointer;display:block}
  .vidbtn img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
  .vidbtn:hover img{transform:scale(1.02)}
  .vidbtn .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 24px -10px rgba(13,20,30,.3);display:flex;align-items:center;justify-content:center;transition:transform .35s ease,background .35s ease,box-shadow .35s ease}
  .vidbtn .play svg{width:24px;height:24px;margin-left:3px;color:var(--accent-2);fill:var(--accent-2);transition:fill .35s ease}
  .vidbtn:hover .play{background:#fff;transform:translate(-50%,-50%) scale(1.08);box-shadow:0 14px 34px -12px rgba(13,20,30,.38)}
  .vidbtn:hover .play svg{color:var(--accent-1);fill:var(--accent-1)}
  .vidnote{color:var(--muted);font-size:.85rem;margin-top:.7rem}
  .vidnote a{color:var(--muted)}

  .phones{display:flex;gap:1rem;justify-content:center}
  .phones img{width:31%;border-radius:22px;box-shadow:0 20px 40px -10px rgba(17,24,39,.25);background:#fff}
  .phones img:nth-child(2){transform:translateY(-18px)}

  .lead{color:var(--text-secondary);line-height:1.6;max-width:64ch;margin:-.6rem 0 1.5rem}

  .platforms{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.25rem}
  .plat{background:var(--card-bg);border-radius:24px;padding:1.75rem;box-shadow:0 10px 30px -5px rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.02);display:flex;flex-direction:column;gap:.9rem}
  .plat header{display:flex;align-items:center;gap:.7rem}
  .plat header svg{width:26px;height:26px;fill:var(--text-primary);flex:none}
  .plat h3{font-size:1.15rem;font-weight:700}
  .plat .req{color:var(--muted);font-size:.85rem;font-weight:400;display:block;margin-top:.1rem}
  .plat p{color:var(--text-secondary);line-height:1.6;font-size:.95rem}
  .plat .route{border-top:1px solid var(--line);padding-top:.9rem;font-size:.93rem;color:var(--text-secondary);line-height:1.6}
  .plat .route b{color:var(--text-primary);font-weight:600}
  .plat .stores{margin-top:auto;padding-top:.3rem}

  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem}
  .step{background:var(--card-bg);border-radius:24px;padding:1.5rem;box-shadow:0 10px 30px -5px rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.02)}
  .step .n{display:inline-block;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent-1),var(--accent-2));color:#fff;font-weight:700;font-size:.85rem;text-align:center;line-height:28px;margin-bottom:.75rem}
  .step h3{font-size:1rem;font-weight:600;margin-bottom:.35rem}
  .step p{color:var(--text-secondary);font-size:.92rem;line-height:1.5}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.25rem}
  .card{background:var(--card-bg);border-radius:24px;padding:2rem;box-shadow:0 10px 30px -5px rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.02)}
  .card h3{font-size:1.1rem;font-weight:600;margin-bottom:.5rem}
  .card p,.card li{color:var(--text-secondary);line-height:1.6}
  .card ul{padding-left:1.1rem}
  .price{font-size:2.4rem;font-weight:800;letter-spacing:-.02em}
  .price small{font-size:1rem;font-weight:400;color:var(--text-secondary)}

  /* faq */
  .faqgroup{margin-bottom:1.5rem}
  .faqgroup h3{display:flex;align-items:center;gap:.5rem;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-secondary);margin-bottom:.7rem}
  .faqgroup h3 svg{width:16px;height:16px;fill:var(--text-secondary)}
  .faq details{background:var(--card-bg);border-radius:16px;padding:1rem 1.25rem;margin-bottom:.6rem;border:1px solid rgba(0,0,0,.03)}
  .faq summary{cursor:pointer;font-weight:600}
  .faq p{color:var(--text-secondary);margin-top:.5rem;line-height:1.6}
  .more{color:var(--text-secondary);line-height:1.6}
  footer{margin-top:4rem;padding-top:2rem;border-top:1px solid rgba(0,0,0,.06);color:var(--text-secondary);font-size:.85rem;display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between}
  [hidden]{display:none!important}
  @media (max-width:760px){.hero{grid-template-columns:1fr}h1{font-size:2.3rem}.lang-toggle{top:1rem;right:1rem}.wrap{padding-top:5rem}}
</style>
</head>

const svg = d => '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + d + '"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function storeButtons(t, which) {
  const apple = '<a class="store" href="' + APP_STORE + '">' + svg(APPLE_PATH) +
    '<span><small>' + esc(t.btn_small_ios) + '</small><b>App Store</b></span></a>';
  const play = ANDROID_LIVE

      '<span><small>' + esc(t.btn_small_and) + '</small><b>Google Play</b></span></a>'
    : '<span class="store soon">' + svg(PLAY_PATH) +
      '<span><small>' + esc(t.btn_small_soon) + '</small><b>Google Play</b></span></span>';
  return which === 'ios' ? apple : which === 'and' ? play : apple + play;
}

// These sentences carry our own markup (links, bold); everything else is inserted as plain text.
const HTML_KEYS = new Set(['ios_route', 'and_route', 'faq_more', 'a1', 'vid_note']);

function apply(lang){
  const t = T[lang] || T.en;
  t.faq_more = t.more;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t[el.dataset.i18n] ?? '';
    if (HTML_KEYS.has(el.dataset.i18n)) el.innerHTML = v; else el.textContent = v;
  });
  document.getElementById('heroStores').innerHTML = storeButtons(t, 'both');
  document.getElementById('iosStore').innerHTML = storeButtons(t, 'ios');
  document.getElementById('andStore').innerHTML = storeButtons(t, 'and');
  document.querySelectorAll('[data-shot]').forEach(img => { img.src = 'img/' + (lang === 'nl' ? 'nl' : 'en') + '-' + img.dataset.shot + '.png'; });
  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  try { localStorage.setItem('divedrop.lang', lang); } catch (e) {}
}
document.querySelectorAll('.lang-toggle button').forEach(b => b.addEventListener('click', () => apply(b.dataset.lang)));
let start = 'en';
try { start = localStorage.getItem('divedrop.lang') || (l => l.startsWith('nl') ? 'nl' : l.startsWith('fr') ? 'fr' : 'en')((navigator.language || '').toLowerCase()); } catch (e) {}
apply(start);

// We host the film ourselves: nothing loads until someone presses play, and then it is our own file.
document.getElementById('vidPlay').addEventListener('click', () => {
  let small = window.innerWidth < 900;
  try { small = small || navigator.connection.saveData === true; } catch (e) {}
  const src = 'video/divedrop-23s' + (small ? '-720' : '') + '.mp4';
  const v = document.createElement('video');
  v.src = src; v.controls = true; v.autoplay = true; v.playsInline = true; v.preload = 'auto';
  v.setAttribute('poster', 'img/video-still.jpg');
  const box = document.getElementById('videobox');
  box.innerHTML = ''; box.appendChild(v);
});
</script>
