<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiveDrop – dive exports into your SSI logbook | Strategea</title>
<meta name="description" content="Share your Oceanic+ (Apple Watch), Garmin, Suunto, Shearwater or UDDF dive export and DiveDrop adds the missing dives to your MySSI logbook, depth profile included. For iPhone and Android.">
<meta property="og:title" content="DiveDrop">
<meta property="og:description" content="Share your dive export. Your SSI logbook is up to date. Profile included. iPhone and Android.">
<link rel="canonical" href="https://divedrop.app/">
<meta property="og:url" content="https://divedrop.app/">
<meta property="og:image" content="https://divedrop.app/img/video-poster.jpg">
<meta property="og:video" content="https://divedrop.app/video/divedrop-23s.mp4">
<meta property="og:video:type" content="video/mp4">
<meta property="og:video:width" content="1920">
<meta property="og:video:height" content="1080">
<link rel="icon" href="img/icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Outfit:wght@300;400;600;800&display=swap">
<style>
  :root{--bg-color:#f9f9fb;--text-primary:#111827;--text-secondary:#4b5563;--muted:#9099a8;--accent-1:#54b3d6;--accent-2:#2a5a8a;--card-bg:#fff;--line:rgba(17,24,39,.08)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit','Montserrat',sans-serif;background:var(--bg-color);color:var(--text-primary);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:var(--accent-2)}
  .wrap{max-width:1000px;margin:0 auto;padding:4rem 1.25rem 3rem}
  .lang-toggle{position:absolute;top:2rem;right:2rem;display:flex;background:var(--card-bg);border-radius:50px;box-shadow:0 4px 6px -1px rgba(0,0,0,.05);padding:.25rem;z-index:10}
  .lang-toggle button{background:transparent;border:0;padding:.5rem 1rem;font-family:inherit;font-weight:600;font-size:.9rem;color:var(--text-secondary);border-radius:50px;cursor:pointer;transition:all .3s}
  .lang-toggle button.active{background:var(--text-primary);color:#fff}
  .brand{display:flex;align-items:center;gap:.6rem;font-weight:600;color:var(--text-secondary);font-size:.9rem;text-decoration:none;margin-bottom:3rem}
  .brand img{height:30px}
  .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:3rem;align-items:center;margin-bottom:4rem}
  .hero .icon{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px -5px rgba(42,90,138,.35);margin-bottom:1.25rem}
  h1{font-size:3rem;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-bottom:.75rem}
  .tag{font-size:1.25rem;color:var(--text-secondary);font-weight:300;max-width:34ch;margin-bottom:1.5rem}

  /* store buttons */
  .stores{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
  .store{display:inline-flex;align-items:center;gap:.7rem;background:var(--text-primary);color:#fff;text-decoration:none;padding:.7rem 1.25rem;border-radius:14px;transition:transform .3s,box-shadow .3s}
  .store:hover{transform:translateY(-2px);box-shadow:0 10px 25px -5px rgba(0,0,0,.25)}
  .store svg{width:22px;height:22px;flex:none;fill:currentColor}
  .store b{display:block;font-size:1rem;font-weight:700;line-height:1.15}
  .store small{display:block;font-size:.7rem;font-weight:400;opacity:.75;letter-spacing:.02em}
  .store.soon{background:var(--card-bg);color:var(--text-secondary);border:1px dashed rgba(17,24,39,.22);cursor:default}
  .store.soon:hover{transform:none;box-shadow:none}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .how-link{display:inline-block;margin-top:1rem;font-weight:600;font-size:.95rem}
  .video{margin:3.5rem 0 0}
  .reviews{margin:3.5rem 0 0}
  .rev-track{display:grid;grid-auto-flow:column;grid-auto-columns:min(34rem,86%);gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;padding:.25rem .1rem 1rem}
  .rev-track::-webkit-scrollbar{display:none}
  .rev{scroll-snap-align:start;background:var(--card-bg);border-radius:22px;padding:1.6rem 1.7rem;border:1px solid rgba(0,0,0,.03);box-shadow:0 10px 30px -8px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:1rem;margin:0}
  .rev blockquote{margin:0;font-size:1.2rem;font-weight:300;line-height:1.55;color:var(--text-primary);text-wrap:pretty}
  .rev figcaption{margin-top:auto;display:flex;align-items:center;gap:.45rem;font-size:.85rem;font-weight:500;color:var(--muted)}
  .rev figcaption svg{width:15px;height:15px;fill:currentColor}
  .rev-nav{display:flex;align-items:center;gap:.5rem;margin-top:.2rem}
  .rev-nav button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(17,24,39,.12);background:var(--card-bg);color:var(--text-primary);font:inherit;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,opacity .2s}
  .rev-nav button:hover:not(:disabled){background:#eef3f7}
  .rev-nav button:disabled{opacity:.35;cursor:default}
  .rev-nav button:focus-visible{outline:2px solid var(--accent-1);outline-offset:2px}
  .rev-dots{display:flex;gap:.35rem;margin-left:.4rem}
  .rev-dots span{width:7px;height:7px;border-radius:50%;background:rgba(17,24,39,.18);transition:background .2s}
  .rev-dots span.on{background:var(--accent-2)}
  .videobox{position:relative;margin-top:1.25rem;border-radius:24px;overflow:hidden;background:#0d0f14;aspect-ratio:16/9;box-shadow:0 20px 45px -15px rgba(17,24,39,.25)}
  .videobox video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0d0f14}
  .vidbtn{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:none;cursor:pointer;display:block}
  .vidbtn img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
  .vidbtn:hover img{transform:scale(1.02)}
  .vidbtn .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 24px -10px rgba(13,20,30,.3);display:flex;align-items:center;justify-content:center;transition:transform .35s ease,background .35s ease,box-shadow .35s ease}
  .vidbtn .play svg{width:24px;height:24px;margin-left:3px;color:var(--accent-2);fill:var(--accent-2);transition:fill .35s ease}
  .vidbtn:hover .play{background:#fff;transform:translate(-50%,-50%) scale(1.08);box-shadow:0 14px 34px -12px rgba(13,20,30,.38)}
  .vidbtn:hover .play svg{color:var(--accent-1);fill:var(--accent-1)}

  .phones{display:flex;gap:1rem;justify-content:center}
  .phones img{width:31%;border-radius:22px;box-shadow:0 20px 40px -10px rgba(17,24,39,.25);background:#fff}
  .phones img:nth-child(2){transform:translateY(-18px)}

  h2{font-size:1.6rem;font-weight:600;margin:3.5rem 0 1.25rem}
  .lead{color:var(--text-secondary);line-height:1.6;max-width:64ch;margin:-.6rem 0 1.5rem}

  /* platform cards */
  .platforms{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.25rem}
  .plat{background:var(--card-bg);border-radius:24px;padding:1.75rem;box-shadow:0 10px 30px -5px rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.02);display:flex;flex-direction:column;gap:.9rem}
  .plat header{display:flex;align-items:center;gap:.7rem}
  .plat header svg{width:26px;height:26px;fill:var(--text-primary);flex:none}
  .plat h3{font-size:1.15rem;font-weight:700}
  .plat .req{color:var(--muted);font-size:.85rem;font-weight:400;display:block;margin-top:.1rem}
  .plat p{color:var(--text-secondary);line-height:1.6;font-size:.95rem}
  .plat .route{border-top:1px solid var(--line);padding-top:.9rem;font-size:.93rem;color:var(--text-secondary);line-height:1.6}
  .plat .route b{color:var(--text-primary);font-weight:600}
  .plat .stores{margin-top:auto;padding-top:.3rem}

  .flow{background:var(--card-bg);border-radius:24px;padding:2rem 1.9rem 1.6rem;box-shadow:0 10px 30px -5px rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.02)}
  .flow ol{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:1.6rem;margin:0;padding:0}
  .flow li{position:relative}
  .flow li:not(:last-child)::after{content:"";position:absolute;top:17px;left:46px;right:calc(-1.6rem + 8px);height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent-1),rgba(84,179,214,.25))}
  .flow .n{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent-1),var(--accent-2));color:#fff;font-weight:700;font-size:.95rem;margin-bottom:.9rem;position:relative;z-index:1}
  .flow h3{font-size:1.05rem;font-weight:600;margin-bottom:.4rem}
  .flow li p{color:var(--text-secondary);font-size:.92rem;line-height:1.55}
  .flow .note{display:flex;gap:.7rem;align-items:flex-start;margin-top:1.6rem;padding-top:1.2rem;border-top:1px solid var(--line);color:var(--text-secondary);font-size:.92rem;line-height:1.55}
  .flow .note svg{width:20px;height:20px;flex:none;margin-top:.1rem;fill:none;stroke:var(--accent-2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .flow .note b{color:var(--text-primary);font-weight:600}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem}
  .feat-vis{aspect-ratio:16/10;border-radius:16px;overflow:hidden;background:#f2f2f7;margin:-.5rem -.5rem 1.4rem;position:relative}
  .feat-vis img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
  .feat-vis img[data-feat="profile"],.feat-vis img[data-feat="site"]{object-fit:contain;background:#fff;padding:.7rem;box-sizing:border-box}
  .feat-vis:has(img[data-feat]){background:#fff;border:1px solid var(--line)}
  .mock{padding:.55rem .7rem;display:flex;flex-direction:column;gap:.35rem;height:100%;justify-content:center}
  .mock .row{background:#fff;border-radius:11px;padding:.4rem .7rem;display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.78rem;line-height:1.25}
  .mock .row b{display:block;font-weight:600;color:var(--text-primary);font-variant-numeric:tabular-nums}
  .mock .row small{color:var(--muted);font-variant-numeric:tabular-nums}
  .mock .row.dim{opacity:.6}
  .chip{font-size:.68rem;font-weight:600;padding:.18rem .5rem;border-radius:999px;white-space:nowrap;text-align:right}
  .chip.new{background:#e3efff;color:#0556b0}.chip.in{background:#ececf0;color:#52525b}.chip.ok{background:#dcf5e3;color:#16803c}.chip.skip{background:#ececf0;color:#71717a}
  .chip-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:.1rem}.chip-wrap i{font-style:normal;font-size:.65rem;color:var(--muted)}
  .privacy-vis{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%, #e3f2f8 0%, #f2f2f7 70%)}
  .privacy-vis svg{width:78px;height:78px;fill:none;stroke:var(--accent-2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .card{background:var(--card-bg);border-radius:24px;padding:2rem;box-shadow:0 10px 30px -5px rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.02)}
  .card h3{font-size:1.1rem;font-weight:600;margin-bottom:.5rem}
  .card p,.card li{color:var(--text-secondary);line-height:1.6}
  .card ul{padding-left:1.1rem}
  .price{font-size:2.4rem;font-weight:800;letter-spacing:-.02em}
  .price small{font-size:1rem;font-weight:400;color:var(--text-secondary)}

  /* faq */
  .faqgroup{margin-bottom:1.5rem}
  .faqgroup h3{display:flex;align-items:center;gap:.5rem;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-secondary);margin-bottom:.7rem}
  .faqgroup h3 svg{width:16px;height:16px;fill:var(--text-secondary)}
  .faq details{background:var(--card-bg);border-radius:16px;padding:1rem 1.25rem;margin-bottom:.6rem;border:1px solid rgba(0,0,0,.03)}
  .faq summary{cursor:pointer;font-weight:600}
  .faq p{color:var(--text-secondary);margin-top:.5rem;line-height:1.6}
  .more{color:var(--text-secondary);line-height:1.6}
  .trust{list-style:none;margin:4rem 0 0;display:flex;flex-wrap:wrap;gap:.6rem 1.6rem}
  .trust li{display:flex;align-items:center;gap:.45rem;font-size:.85rem;color:var(--text-secondary)}
  .trust svg{width:17px;height:17px;flex:none;fill:none;stroke:var(--accent-2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  footer{margin-top:1.75rem;padding-top:2rem;border-top:1px solid rgba(0,0,0,.06);color:var(--text-secondary);font-size:.85rem;display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between}
  [hidden]{display:none!important}
  @media (max-width:760px){.grid2{grid-template-columns:1fr}.feat-vis{aspect-ratio:16/11}.flow{padding:1.6rem 1.3rem 1.3rem}.flow ol{grid-template-columns:1fr;gap:1.4rem}.flow li{padding-left:52px}.flow .n{position:absolute;left:0;top:0;margin:0}.flow li:not(:last-child)::after{top:42px;left:16px;right:auto;bottom:calc(-1.4rem + 6px);width:2px;height:auto;background:linear-gradient(180deg,var(--accent-1),rgba(84,179,214,.25))}.hero{grid-template-columns:1fr}h1{font-size:2.3rem}.lang-toggle{top:1rem;right:1rem}.wrap{padding-top:5rem}}
</style>
</head>
<body>
<div class="lang-toggle" aria-label="Language">
  <button data-lang="en">EN</button><button data-lang="fr">FR</button><button data-lang="nl">NL</button>
</div>
<main class="wrap">
  <a class="brand" href="https://strategea.be/"><img src="img/strategea.svg" alt="Strategea"> <span data-i18n="by"></span></a>

  <section class="hero">
    <div>
      <img class="icon" src="img/icon.png" alt="DiveDrop app icon">
      <h1>DiveDrop</h1>
      <p class="tag" data-i18n="tag"></p>
      <div class="stores" id="heroStores"></div>
      <a class="how-link" href="#how" data-i18n="how_link"></a>
    </div>
    <div class="phones">
      <img data-shot="04-share-sheet" alt="Share sheet with DiveDrop">
      <img data-shot="01-list" alt="DiveDrop dive list with sync status">
      <img data-shot="02-detail" alt="Dive detail with depth profile and map">
    </div>
  </section>

  <section class="video">
    <h2 data-i18n="vid_h"></h2>
    <p class="lead" data-i18n="vid_lead"></p>
    <div class="videobox" id="videobox">
      <button class="vidbtn" id="vidPlay" type="button">
        <img src="img/video-still.jpg" alt="" width="1600" height="900" loading="lazy">
        <span class="play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 6.8v10.4l8.6-5.2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg></span>
        <span class="sr" data-i18n="vid_play"></span>
      </button>
    </div>
  </section>

  <section class="reviews" aria-roledescription="carousel" data-i18n-aria="rev_label">
    <div class="rev-track" id="revTrack"></div>
    <div class="rev-nav">
      <button type="button" id="revPrev" data-i18n-aria="rev_prev">&larr;</button>
      <button type="button" id="revNext" data-i18n-aria="rev_next">&rarr;</button>
      <div class="rev-dots" id="revDots" aria-hidden="true"></div>
    </div>
  </section>

  <h2 data-i18n="plat_h"></h2>
  <p class="lead" data-i18n="plat_lead"></p>
  <div class="platforms">
    <article class="plat">
      <header>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.3.9-1.3 1.3-2.6 1.3-2.6s-2.5-1-2.5-3.8zM14.2 5.9c.6-.8 1.1-1.9 1-3-.9 0-2.1.6-2.8 1.4-.6.7-1.2 1.8-1 2.9 1 .1 2.1-.5 2.8-1.3z"/></svg>
        <div><h3 data-i18n="ios_h"></h3><span class="req" data-i18n="ios_req"></span></div>
      </header>
      <p data-i18n="ios_p"></p>
      <p class="route" data-i18n="ios_route"></p>
      <div class="stores" id="iosStore"></div>
    </article>
    <article class="plat">
      <header>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.6 9.48l1.84-3.18a.38.38 0 0 0-.14-.52.38.38 0 0 0-.52.14l-1.86 3.22a11.43 11.43 0 0 0-9.84 0L5.22 5.92a.38.38 0 0 0-.52-.14.38.38 0 0 0-.14.52L6.4 9.48A10.81 10.81 0 0 0 1 18h22a10.81 10.81 0 0 0-5.4-8.52zM7 15.25a1.25 1.25 0 1 1 1.25-1.25A1.25 1.25 0 0 1 7 15.25zm10 0a1.25 1.25 0 1 1 1.25-1.25A1.25 1.25 0 0 1 17 15.25z"/></svg>
        <div><h3 data-i18n="and_h"></h3><span class="req" data-i18n="and_req"></span></div>
      </header>
      <p data-i18n="and_p"></p>
      <p class="route" data-i18n="and_route"></p>
      <div class="stores" id="andStore"></div>
    </article>
  </div>

  <h2 id="how" data-i18n="how"></h2>
  <div class="flow">
    <ol>
      <li><span class="n">1</span><h3 data-i18n="s1t"></h3><p data-i18n="s1d"></p></li>
      <li><span class="n">2</span><h3 data-i18n="s2t"></h3><p data-i18n="s2d"></p></li>
      <li><span class="n">3</span><h3 data-i18n="s4t"></h3><p data-i18n="s4d"></p></li>
      <li><span class="n">4</span><h3 data-i18n="s3t"></h3><p data-i18n="s3d"></p></li>
    </ol>
    <p class="note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span><b data-i18n="s5t"></b> &middot; <span data-i18n="s5d"></span></span></p>
  </div>

  <h2 data-i18n="what"></h2>
  <div class="grid2">
    <div class="card"><div class="feat-vis"><img data-feat="profile" alt="" loading="lazy"></div><h3 data-i18n="f1t"></h3><p data-i18n="f1d"></p></div>
    <div class="card"><div class="feat-vis"><img data-feat="site" alt="" loading="lazy"></div><h3 data-i18n="f2t"></h3><p data-i18n="f2d"></p></div>
    <div class="card"><div class="feat-vis"><div class="mock" id="dupMock" aria-hidden="true"></div></div><h3 data-i18n="f3t"></h3><p data-i18n="f3d"></p></div>
    <div class="card"><div class="feat-vis privacy-vis" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.5 10.5 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3.1 4"/><path d="M6.6 6.6C3.9 8.4 2.5 12 2.5 12S6 19 12 19a9.6 9.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></div><h3 data-i18n="f4t"></h3><p data-i18n="f4d"></p></div>
  </div>

  <h2 data-i18n="pricing"></h2>
  <div class="grid2">
    <div class="card">
      <div class="price">€0 <small data-i18n="p_free_s"></small></div>
      <p data-i18n="p_free"></p>
    </div>
    <div class="card">
      <div class="price">€4,99 <small data-i18n="p_once_s"></small></div>
      <p data-i18n="p_once"></p>
    </div>
  </div>

  <h2 data-i18n="faq"></h2>
  <div class="faq">
    <details><summary data-i18n="q1"></summary><p data-i18n="a1"></p></details>
    <details><summary data-i18n="q2"></summary><p data-i18n="a2"></p></details>
    <details><summary data-i18n="q3"></summary><p data-i18n="a3"></p></details>
    <p class="more" data-i18n="faq_more"></p>
  </div>

// Reviews on the product page. Add new ones at the end; each is shown in quotation marks.
// `quote` as a string: the reviewer's own words, in the language they wrote (set `lang`).
// `quote` as an object per language: an anonymised rewording of a real message, faithful to what the
// person said. `source` picks the caption.
const REVIEWS = [
  { source: 'appstore', lang: 'en',
    quote: "Thank you so much for this useful and user friendly app! No more manual import from Garmin Dive to SSI App thanks to you! … it also imports dive graphics to SSI." },
  { source: 'user',
    quote: { en: "Thank you for DiveDrop. I moved dozens of dives into SSI with it, and I'm really glad this is finally possible.",
             fr: "Merci pour DiveDrop. J'ai transféré des dizaines de plongées dans SSI avec l'app, et je suis vraiment content que ce soit enfin possible.",
             nl: "Bedankt voor DiveDrop. Ik zette er tientallen duiken mee in SSI, en ik ben echt blij dat dit eindelijk kan." } },
  { source: 'user',
    quote: { en: "Thank you, thank you, thank you! More than a hundred dives, and not one of them typed in by hand on my phone.",
             fr: "Merci, merci, merci ! Plus d'une centaine de plongées, et pas une seule saisie à la main sur mon téléphone.",
             nl: "Dank je, dank je, dank je! Meer dan honderd duiken, en geen enkele met de hand op mijn telefoon ingetikt." } },
];
function renderReviews(t, lang) {
  const track = document.getElementById('revTrack');
  track.innerHTML = REVIEWS.map(r => {
    const text = typeof r.quote === 'string' ? r.quote : (r.quote[lang] || r.quote.en);
    const inLang = typeof r.quote === 'string' ? r.lang : (r.quote[lang] ? lang : 'en');
    const body = `<blockquote lang="${inLang}">&ldquo;${esc(text)}&rdquo;</blockquote>`;
    const icon = r.source === 'appstore' ? `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${APPLE_PATH}"/></svg>` : '';
    return `<figure class="rev">${body}<figcaption>${icon}<span>${esc(t['src_' + r.source] || '')}</span></figcaption></figure>`;
  }).join('');
  document.getElementById('revDots').innerHTML = REVIEWS.map(() => '<span></span>').join('');
  updateReviewNav();
}
function updateReviewNav() {
  const track = document.getElementById('revTrack'), cards = [...track.children];
  if (!cards.length) return;
  const w = cards[0].getBoundingClientRect().width + 16;
  const i = Math.round(track.scrollLeft / w);
  document.getElementById('revPrev').disabled = track.scrollLeft < 4;
  document.getElementById('revNext').disabled = track.scrollLeft + track.clientWidth >= track.scrollWidth - 4;
  [...document.getElementById('revDots').children].forEach((d, k) => d.classList.toggle('on', k === Math.min(i, cards.length - 1)));
  document.querySelector('.rev-nav').hidden = track.scrollWidth <= track.clientWidth + 4;
}
function stepReviews(dir) {
  const track = document.getElementById('revTrack'), card = track.children[0];
  if (card) track.scrollBy({ left: dir * (card.getBoundingClientRect().width + 16), behavior: 'smooth' });
}

// "No duplicates" card: a small mock of the dive list with each status the app shows.
function renderDupMock(t, lang) {
  const loc = { en: 'en-GB', fr: 'fr-BE', nl: 'nl-BE' }[lang] || 'en-GB';
  const when = d => new Intl.DateTimeFormat(loc, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(d);
  const num = (v, dec) => new Intl.NumberFormat(loc, { minimumFractionDigits: dec, maximumFractionDigits: dec }).format(v);
  const rows = [
    [new Date(2026, 7, 22, 14, 22), num(8.2, 1) + ' m · 49 min', 'new', t.chip_new, ''],
    [new Date(2026, 7, 13, 20, 0), num(8.1, 1) + ' m · 26 min', 'in', t.chip_in, '±6 min'],
    [new Date(2026, 7, 19, 19, 53), num(14.7, 1) + ' m · 48 min', 'ok', t.chip_ok, ''],
    [new Date(2026, 7, 2, 11, 5), t.mock_pool + ' · ' + num(3.4, 1) + ' m · 4 min', 'skip', t.chip_skip, ''],
  ];
  document.getElementById('dupMock').innerHTML = rows.map(([d, meta, cls, label, extra]) =>
    `<div class="row${cls === 'skip' ? ' dim' : ''}"><span><b>${esc(when(d))}</b><small>${esc(meta)}</small></span>` +
    `<span class="chip-wrap"><span class="chip ${cls}">${esc(label)}</span>${extra ? `<i>${esc(extra)}</i>` : ''}</span></div>`).join('');
}

// These sentences carry our own markup (links, bold); everything else is inserted as plain text.
const HTML_KEYS = new Set(['ios_route', 'and_route', 'faq_more', 'a1']);

function apply(lang){
  const t = T[lang] || T.en;
  t.faq_more = t.more;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t[el.dataset.i18n] ?? '';
    if (HTML_KEYS.has(el.dataset.i18n)) el.innerHTML = v; else el.textContent = v;
  });
  document.getElementById('heroStores').innerHTML = storeButtons(t, 'both');
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t[el.dataset.i18nAria] || ''));
  renderReviews(t, lang);
  renderDupMock(t, lang);
  document.querySelectorAll('[data-feat]').forEach(img => { img.src = 'img/' + (lang === 'nl' ? 'nl' : 'en') + '-feat-' + img.dataset.feat + '.jpg'; });
  document.getElementById('iosStore').innerHTML = storeButtons(t, 'ios');
  document.getElementById('andStore').innerHTML = storeButtons(t, 'and');
  document.querySelectorAll('[data-shot]').forEach(img => { img.src = 'img/' + (lang === 'nl' ? 'nl' : 'en') + '-' + img.dataset.shot + '.png'; });
  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  try { localStorage.setItem('divedrop.lang', lang); } catch (e) {}
}
document.querySelectorAll('.lang-toggle button').forEach(b => b.addEventListener('click', () => apply(b.dataset.lang)));
let start = 'en';
try { start = localStorage.getItem('divedrop.lang') || (l => l.startsWith('nl') ? 'nl' : l.startsWith('fr') ? 'fr' : 'en')((navigator.language || '').toLowerCase()); } catch (e) {}
apply(start);
document.getElementById('revPrev').addEventListener('click', () => stepReviews(-1));
document.getElementById('revNext').addEventListener('click', () => stepReviews(1));
document.getElementById('revTrack').addEventListener('scroll', updateReviewNav, { passive: true });
window.addEventListener('resize', updateReviewNav);

// We host the film ourselves: nothing loads until someone presses play, and then it is our own file.
document.getElementById('vidPlay').addEventListener('click', () => {
  let small = window.innerWidth < 900;
  try { small = small || navigator.connection.saveData === true; } catch (e) {}
  const src = 'video/divedrop-23s' + (small ? '-720' : '') + '.mp4';
  const v = document.createElement('video');
  v.src = src; v.controls = true; v.autoplay = true; v.playsInline = true; v.preload = 'auto';
  v.setAttribute('poster', 'img/video-still.jpg');
  const box = document.getElementById('videobox');
  box.innerHTML = ''; box.appendChild(v);
});
</script>
</body>
